<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2A1A0C" />
  <meta name="robots" content="noindex" />
  <title>Apartman Mirakul — Vodič za goste</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F8F4EE;
      --surface: #ffffff;
      --primary: #2A1A0C;
      --accent: #C49A4A;
      --border: #E2D8CC;
      --muted: #7A6A5A;
      --green: #1a7a45;
      --green-bg: #edf7f1;
      --green-border: #b7ddc8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); }
    body { min-height: 100vh; }
    a { color: inherit; }

    /* ── LANG SCREEN ── */
    #lang-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.25rem 3rem;
    }
    .lang-brand {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--primary);
      margin-bottom: 0.3rem;
    }
    .lang-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2rem;
      text-align: center;
    }
    .lang-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      width: 100%;
      max-width: 360px;
    }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--primary);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .lang-btn:hover, .lang-btn:active { background: #F5EDE1; border-color: var(--accent); }
    .lang-flag { font-size: 1.25rem; }

    /* ── GUIDE ── */
    #guide {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
    }
    #guide.visible { display: flex; }

    .guide-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.25rem;
    }
    .guide-header-name { font-size: 1rem; font-weight: 700; }
    .lang-change-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .lang-change-btn:hover { background: rgba(255,255,255,0.25); }

    .guide-content {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      flex: 1;
    }

    /* WiFi */
    .wifi-card {
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: 18px;
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .wifi-row { display: flex; align-items: center; gap: 0.75rem; }
    .wifi-icon { font-size: 1.3rem; flex-shrink: 0; }
    .wifi-info { flex: 1; min-width: 0; }
    .wifi-label { font-size: 0.72rem; color: var(--green); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .wifi-value { font-size: 1rem; font-weight: 700; color: var(--primary); }
    .copy-btn {
      display: flex; align-items: center; gap: 0.4rem;
      background: var(--green); color: #fff; border: none;
      border-radius: 10px; padding: 0.5rem 0.9rem;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      flex-shrink: 0; font-family: inherit; transition: opacity 0.2s;
      white-space: nowrap;
    }
    .copy-btn:active { opacity: 0.75; }

    /* Accordion */
    .acc-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .acc-trigger {
      width: 100%; display: flex; align-items: center; gap: 0.75rem;
      padding: 1rem 1.1rem; background: none; border: none;
      font-family: inherit; font-size: 0.98rem; font-weight: 600;
      color: var(--primary); cursor: pointer; text-align: left;
    }
    .acc-icon { font-size: 1.2rem; flex-shrink: 0; }
    .acc-arrow { margin-left: auto; font-size: 0.75rem; color: var(--muted); transition: transform 0.25s ease; flex-shrink: 0; }
    .acc-item.open .acc-arrow { transform: rotate(180deg); }
    .acc-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
    .acc-item.open .acc-body { max-height: 1400px; }
    .acc-inner { padding: 0.85rem 1.1rem 1.1rem; border-top: 1px solid var(--border); }

    /* Content inside accordion */
    .item-list { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
    .item-list li { display: flex; align-items: center; gap: 0.75rem; font-size: 0.93rem; }
    .item-label { color: var(--muted); font-size: 0.82rem; min-width: 110px; flex-shrink: 0; }
    .item-list a { color: var(--primary); font-weight: 700; text-decoration: none; font-size: 1.05rem; }

    .bullet-list { padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 0.45rem; }
    .bullet-list li { font-size: 0.93rem; line-height: 1.55; color: var(--primary); padding-left: 0; }

    .place-card { padding: 0.65rem 0; border-bottom: 1px solid var(--border); }
    .place-card:last-child { border-bottom: none; padding-bottom: 0; }
    .place-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.2rem; }
    .place-dist {
      display: inline-flex; align-items: center;
      font-size: 0.72rem; font-weight: 600; color: var(--accent);
      background: #F5EDE1; border-radius: 999px; padding: 0.1rem 0.5rem;
      margin-bottom: 0.2rem;
    }
    .place-desc { font-size: 0.84rem; color: var(--muted); line-height: 1.5; }

    .checkin-row { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .checkin-row:last-of-type { border-bottom: none; }
    .checkin-time { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -0.02em; }
    .checkin-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.1rem; }

    .guide-tip {
      background: #F5EDE1; border-radius: 10px;
      padding: 0.65rem 0.9rem; font-size: 0.84rem;
      color: var(--primary); margin-top: 0.65rem; line-height: 1.55;
    }

    .guide-item { display: flex; gap: 0.75rem; padding: 0.55rem 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .guide-item:last-child { border-bottom: none; padding-bottom: 0; }
    .guide-item-icon { font-size: 1.25rem; flex-shrink: 0; margin-top: 0.1rem; }
    .guide-item-text strong { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.15rem; }
    .guide-item-text span { font-size: 0.84rem; color: var(--muted); line-height: 1.5; }
    .local-group-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0.9rem 0 0.4rem; border-top: 1px solid var(--border); }
    .local-group-title:first-child { border-top: none; padding-top: 0; }
    .subgroup-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 1rem; background: #F0EAE0; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 0.5rem; cursor: pointer; font-size: 0.92rem; font-weight: 600; color: var(--primary); text-align: left; transition: background 0.15s; }
    .subgroup-btn.open { background: #E6DDD0; }
    .subgroup-arrow { font-size: 0.7rem; transition: transform 0.25s; flex-shrink: 0; color: var(--muted); }
    .subgroup-btn.open .subgroup-arrow { transform: rotate(180deg); }
    .subgroup-panel { display: none; margin-bottom: 0.5rem; }
    .subgroup-panel.open { display: block; }
    .subgroup-html { padding: 0.1rem 0 0.25rem; }
    .swipe-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; border-radius: 12px; margin-bottom: 0.25rem; }
    .swipe-carousel::-webkit-scrollbar { display: none; }
    .swipe-card { flex: 0 0 100%; scroll-snap-align: start; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
    .swipe-card-img { width: 100%; height: 210px; background: linear-gradient(135deg, #e8ddd0, #d4c4b0); display: flex; align-items: center; justify-content: center; font-size: 4rem; overflow: hidden; }
    .swipe-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .swipe-card-body { padding: 1.25rem 1.25rem 1.5rem; }
    .swipe-card-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.2rem; }
    .swipe-card-dist { font-size: 0.78rem; color: var(--accent); font-weight: 700; margin-bottom: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .swipe-card-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.55; margin-bottom: 1.1rem; }
    .swipe-card-link { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--primary); color: #fff; padding: 0.6rem 1.1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; }

    /* Footer */
    .guide-footer { text-align: center; padding: 2rem 1.25rem 2.5rem; }
    .guide-footer .heart { color: var(--accent); font-size: 1.5rem; display: block; margin-bottom: 0.5rem; }
    .guide-footer span { font-size: 1rem; color: var(--muted); }
  </style>
</head>
<body>

<!-- LANGUAGE SELECTION -->
<div id="lang-screen">
  <div style="text-align:center; margin-bottom: 2rem;">
    <div style="font-size:2rem; margin-bottom:0.5rem;">🏠</div>
    <div class="lang-brand">Apartman Mirakul</div>
    <div class="lang-subtitle">Izaberite jezik · Choose language</div>
  </div>
  <div class="lang-grid">
    <button class="lang-btn" onclick="setLang('sr')"><span class="lang-flag">🇷🇸</span> Srpski</button>
    <button class="lang-btn" onclick="setLang('hr')"><span class="lang-flag">🇭🇷</span> Hrvatski</button>
    <button class="lang-btn" onclick="setLang('hu')"><span class="lang-flag">🇭🇺</span> Magyar</button>
    <button class="lang-btn" onclick="setLang('en')"><span class="lang-flag">🇬🇧</span> English</button>
    <button class="lang-btn" onclick="setLang('de')"><span class="lang-flag">🇩🇪</span> Deutsch</button>
    <button class="lang-btn" onclick="setLang('ru')"><span class="lang-flag">🇷🇺</span> Русский</button>
    <button class="lang-btn" onclick="setLang('zh')"><span class="lang-flag">🇨🇳</span> 中文</button>
    <button class="lang-btn" onclick="setLang('bg')"><span class="lang-flag">🇧🇬</span> Български</button>
    <button class="lang-btn" onclick="setLang('pl')"><span class="lang-flag">🇵🇱</span> Polski</button>
    <button class="lang-btn" onclick="setLang('it')"><span class="lang-flag">🇮🇹</span> Italiano</button>
    <button class="lang-btn" onclick="setLang('es')"><span class="lang-flag">🇪🇸</span> Español</button>
    <button class="lang-btn" onclick="setLang('mk')"><span class="lang-flag">🇲🇰</span> Македонски</button>
    <button class="lang-btn" onclick="setLang('sl')"><span class="lang-flag">🇸🇮</span> Slovenščina</button>
    <button class="lang-btn" onclick="setLang('ro')"><span class="lang-flag">🇷🇴</span> Română</button>
  </div>
</div>

<!-- GUIDE -->
<div id="guide">
  <div class="guide-header">
    <div class="guide-header-name">Apartman Mirakul</div>
    <button class="lang-change-btn" id="lang-btn" onclick="showLangScreen()">🇷🇸 SR</button>
  </div>
  <div class="guide-content">
    <div class="wifi-card">
      <div class="wifi-row">
        <span class="wifi-icon">📶</span>
        <div class="wifi-info">
          <div class="wifi-label" id="wifi-net-lbl">WiFi</div>
          <div class="wifi-value">Apartman Mirakul 5G</div>
        </div>
      </div>
      <div class="wifi-row">
        <span class="wifi-icon">🔑</span>
        <div class="wifi-info">
          <div class="wifi-label" id="wifi-pass-lbl">Lozinka</div>
          <div class="wifi-value">dobrodoali</div>
        </div>
        <button class="copy-btn" onclick="copyWifi()">📋 <span id="copy-lbl">Kopiraj</span></button>
      </div>
    </div>
    <div id="sections"></div>
  </div>
  <div class="guide-footer">
    <span class="heart">♥</span>
    <span id="footer-txt"></span>
  </div>
</div>

      {i:'💡',t:'Navodila za apartma',h:`<div class="guide-item"><span class="guide-item-icon">❄️</span><div class="guide-item-text"><strong>Klimatska naprava</strong><span>Daljinec je na mizi v dnevni sobi.</span></div></div><div class="guide-item"><span class="guide-item-icon">📺</span><div class="guide-item-text"><strong>Smart TV 50"</strong><span>Pritisnite HOME za Netflix, YouTube.</span></div></div><div class="guide-item"><span class="guide-item-icon">☕</span><div class="guide-item-text"><strong>Aparat za espresso</strong><span>Kapsule so v predalu pod aparatom.</span></div></div>`}
    ]
  },
  ro: {
    wn:'Nume rețea WiFi', wp:'Parolă', cp:'Copiază', cd:'Copiat!',
    ft:'Vă mulțumim că ați fost oaspeții noștri!',
    s:[
      {i:'🚨',t:'Numere de urgență',h:EMERGENCY('Poliție','Ambulanță','Pompieri','Gazdă Boris')},
      {i:'🏠',t:'Regulament intern',h:`<ul class="bullet-list"><li>🌙 Liniște între <strong>22:00–08:00</strong></li><li>🚭 <strong>Fumatul interzis</strong> în apartament și clădire</li><li>🐾 <strong>Animalele de companie nu sunt permise</strong></li><li>👥 Capacitate maximă: <strong>4 persoane</strong></li><li>🧹 Vă rugăm să lăsați apartamentul curat la plecare</li><li>🔑 Lăsați cheile pe masă la plecare</li></ul>`},
      {i:'🕐',t:'Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">până la 11:00</div></div></div><div class="guide-tip">🔑 Lăsați cheile pe masă înainte de plecare.</div>`},
      {i:'🅿️',t:'Parcare',h:`<ul class="bullet-list"><li>🚗 Parcare orășenească cu plată <strong>în fața clădirii</strong></li><li>💰 Cu plată în zilele lucrătoare</li><li>🎉 <strong>Weekend și sărbători — GRATUIT</strong></li></ul>`},
      {i:'📍',t:'Recomandări locale',h:`<div class="local-group-title">🍽️ Restaurante și cafenele</div><div class="place-card"><div class="place-name">Boss Caffe</div><span class="place-dist">50 m</span><div class="place-desc">Mic dejun excelent, prânz și cafea. Chiar sub clădire.</div></div><div class="place-card"><div class="place-name">Korzo</div><span class="place-dist">2 min mers</span><div class="place-desc">Zonă pietonală plină de cafenele și restaurante.</div></div><div class="local-group-title">🏛️ Atracții</div><div class="place-card"><div class="place-name">Primăria (Gradska kuća)</div><span class="place-dist">300 m</span><div class="place-desc">Simbolul Suboticăi — impozant edificiu Art Nouveau din 1910.</div></div><div class="place-card"><div class="place-name">Sinagoga</div><span class="place-dist">500 m</span><div class="place-desc">Una dintre cele mai frumoase sinagogi din Europa.</div></div><div class="place-card"><div class="place-name">Lacul Palić</div><span class="place-dist">8 km</span><div class="place-desc">Destinație populară — lac, parc, grădină zoologică, plajă.</div></div>`},

    ]
  }
};

let currentLang = 'sr';

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('mirakul_lang', lang);
  const t = T[lang];
  document.getElementById('wifi-net-lbl').textContent = t.wn;
  document.getElementById('wifi-pass-lbl').textContent = t.wp;
  document.getElementById('copy-lbl').textContent = t.cp;
  document.getElementById('footer-txt').textContent = t.ft;
  document.getElementById('lang-btn').textContent = FLAGS[lang] + ' ' + CODES[lang];
  document.getElementById('sections').innerHTML = t.s.map((s,i) => {
    const inner = s.subs
      ? s.subs.map(sub =>
          `<button class="subgroup-btn" onclick="togSub(this)"><span>${sub.t}</span><span class="subgroup-arrow">▼</span></button>` +
          `<div class="subgroup-panel">` +
          (sub.cards
            ? `<div class="swipe-carousel">${sub.cards.map(c =>
                `<div class="swipe-card"><div class="swipe-card-img">${c.img ? `<img src="${c.img}" alt="${c.name}">` : c.emoji}</div><div class="swipe-card-body"><div class="swipe-card-name">${c.name}</div><div class="swipe-card-dist">${c.dist}</div><div class="swipe-card-desc">${c.desc}</div><a href="${c.maps}" target="_blank" rel="noopener" class="swipe-card-link">📍 Google Maps</a></div></div>`
              ).join('')}</div>`
            : `<div class="subgroup-html">${sub.h}</div>`) +
          `</div>`
        ).join('')
      : s.h;
    return `<div class="acc-item" id="a${i}"><button class="acc-trigger" onclick="tog(${i})"><span class="acc-icon">${s.i}</span><span>${s.t}</span><span class="acc-arrow">▼</span></button><div class="acc-body"><div class="acc-inner">${inner}</div></div></div>`;
  }).join('');
  document.getElementById('lang-screen').style.display = 'none';
  const g = document.getElementById('guide');
  g.style.display = 'flex';
}

function showLangScreen() {
  document.getElementById('lang-screen').style.display = 'flex';
  document.getElementById('guide').style.display = 'none';
}

function tog(i) {
  const el = document.getElementById('a' + i);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.acc-item.open').forEach(e => e.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}

function togSub(btn) {
  const panel = btn.nextElementSibling;
  const wasOpen = btn.classList.contains('open');
  btn.closest('.acc-inner').querySelectorAll('.subgroup-btn').forEach(b => b.classList.remove('open'));
  btn.closest('.acc-inner').querySelectorAll('.subgroup-panel').forEach(p => p.classList.remove('open'));
  if (!wasOpen) { btn.classList.add('open'); panel.classList.add('open'); }
}

function copyWifi() {
  const pw = 'dobrodoali';
  const lbl = document.getElementById('copy-lbl');
  const done = () => { lbl.textContent = T[currentLang].cd; setTimeout(() => { lbl.textContent = T[currentLang].cp; }, 2000); };
  if (navigator.clipboard) { navigator.clipboard.writeText(pw).then(done); }
  else { const el = document.createElement('textarea'); el.value = pw; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); done(); }
}

const saved = localStorage.getItem('mirakul_lang');
if (saved && T[saved]) setLang(saved);
</script>

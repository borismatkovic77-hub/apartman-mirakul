<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3E2723" />
  <meta name="robots" content="noindex" />
  <title>Apartman Mirakul — Vodič za goste</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FBF6F1;
      --surface: #ffffff;
      --primary: #3E2723;
      --accent: #8B5E3C;
      --accent-light: #F5EBE0;
      --border: #E2D0BF;
      --muted: #9A7A6A;
      --shadow: 0 2px 12px rgba(74,44,26,0.08);
    }
    /* ── PRVI DOLAZAK kartica ── */
    .arr-q { font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:.1rem 0 .7rem; }
    .arr-mode { margin-bottom:.55rem; }
    .arr-choice { display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; background:var(--accent-light); border:1.5px solid var(--border); border-radius:12px; padding:.8rem 1rem; font-size:1rem; font-weight:600; color:var(--primary); cursor:pointer; font-family:inherit; }
    .arr-choice .arr-ce { font-size:1.2rem; }
    .arr-choice .arr-ar { margin-left:auto; color:var(--muted); transition:transform .25s; }
    .arr-mode.open .arr-choice { background:var(--accent); border-color:var(--accent); color:#fff; border-radius:12px 12px 0 0; }
    .arr-mode.open .arr-choice .arr-ar { transform:rotate(180deg); color:#fff; }
    .arr-panel { display:none; border:1.5px solid var(--accent); border-top:none; border-radius:0 0 12px 12px; padding:.9rem 1rem; background:var(--surface); }
    .arr-mode.open .arr-panel { display:block; }
    .arr-panel p { margin:.5rem 0; }
    .arr-panel p:first-child { margin-top:0; }
    .arr-warn { background:#fff4e8; border:1px solid #f0d3a6; border-radius:10px; padding:.65rem .8rem; font-size:.92rem; }
    .arr-row { display:flex; gap:.5rem; align-items:flex-start; margin:.6rem 0; font-size:.95rem; }
    .arr-btn { display:inline-flex; align-items:center; gap:.4rem; background:var(--accent); color:#fff; border-radius:11px; padding:.7rem 1rem; font-size:.95rem; font-weight:700; text-decoration:none; margin:.4rem 0; }
    .arr-btn.ghost { background:var(--surface); color:var(--primary); border:1.5px solid var(--border); }
    .arr-hours { font-size:.85rem; color:var(--muted); margin-top:.35rem; }
    .arr-checkin { margin-top:1rem; background:var(--accent-light); border:1px solid var(--border); border-radius:13px; padding:.9rem 1rem; }
    .arr-checkin h4 { margin:0 0 .5rem; font-size:.95rem; color:var(--primary); }
    .arr-mp { margin:.7rem 0; }
    .arr-mp img { width:100%; border-radius:12px; border:1px solid var(--border); display:block; cursor:zoom-in; }
    .arr-mp figcaption { font-size:.8rem; color:var(--muted); margin-top:.3rem; text-align:center; }
    #arr-lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; align-items:center; justify-content:center; padding:1.5rem; cursor:zoom-out; }
    #arr-lightbox.open { display:flex; }
    #arr-lightbox img { max-width:100%; max-height:100%; border-radius:10px; }
    .arr-btns { display:flex; gap:.4rem; margin-top:.5rem; }
    .arr-cbtn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:.3rem; padding:.55rem .3rem; border-radius:10px; font-size:.8rem; font-weight:700; text-decoration:none; color:#fff; }
    .arr-cbtn svg { width:15px; height:15px; fill:currentColor; flex-shrink:0; }
    .arr-cbtn.wa { background:#25d366; } .arr-cbtn.vi { background:#7360f2; } .arr-cbtn.call { background:#5b6470; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); font-size: 16px; line-height: 1.5; }
    body { min-height: 100vh; }
    a { color: inherit; }

    /* ── LANG SCREEN ── */
    #lang-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 3rem;
    }
    .lang-brand {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }
    .lang-subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      text-align: center;
    }
    .lang-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      width: 100%;
      max-width: 420px;
    }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.1rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.97rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      box-shadow: var(--shadow);
    }
    .lang-btn:hover, .lang-btn:active { background: var(--accent-light); border-color: var(--primary); }
    .lang-flag { height: 1.15rem; width: auto; vertical-align: middle; border-radius: 2px; }
    .lang-flag-sm { height: 0.95rem; width: auto; vertical-align: middle; border-radius: 1px; }

    /* ── GUIDE ── */
    #guide {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      max-width: 640px;
      margin: 0 auto;
    }
    #guide.visible { display: flex; }

    .guide-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
    }
    .guide-header-name { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
    .lang-change-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .lang-change-btn:hover { background: rgba(255,255,255,0.22); }

    .guide-content {
      padding: 1.25rem 1.25rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex: 1;
    }

    /* ── WiFi — light card ── */
    .wifi-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 1.4rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--shadow);
    }
    .wifi-row { display: flex; align-items: center; gap: 0.9rem; }
    .wifi-icon { font-size: 1.1rem; flex-shrink: 0; color: var(--primary); }
    .wifi-info { flex: 1; min-width: 0; }
    .wifi-label { font-size: 0.68rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 0.2rem; }
    .wifi-value { font-size: 1.05rem; font-weight: 700; color: #2A1A0C; }
    .copy-btn {
      display: flex; align-items: center; gap: 0.4rem;
      background: var(--primary); color: #fff; border: none;
      border-radius: 8px; padding: 0.55rem 1rem;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
      flex-shrink: 0; font-family: inherit; transition: opacity 0.2s;
      white-space: nowrap;
    }
    .copy-btn:active { opacity: 0.75; }

    /* ── Accordion ── */
    .acc-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }
    .acc-item.open { border-color: var(--primary); }
    .acc-trigger {
      width: 100%; display: flex; align-items: center; gap: 0.75rem;
      padding: 1.15rem 1.25rem; background: none; border: none;
      font-family: inherit; font-size: 1.02rem; font-weight: 700;
      color: var(--primary); cursor: pointer; text-align: left;
      letter-spacing: -0.01em;
    }
    .acc-icon {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; flex-shrink: 0;
      background: var(--accent-light); border-radius: 8px; font-size: 1rem;
    }
    .acc-arrow {
      margin-left: auto;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); border-radius: 50%;
      font-size: 0.65rem; color: var(--muted);
      transition: transform 0.25s ease, background 0.2s;
      flex-shrink: 0;
    }
    .acc-item.open .acc-arrow { transform: rotate(180deg); background: var(--accent-light); color: var(--primary); }
    .acc-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
    .acc-item.open .acc-body { max-height: 5000px; }
    .acc-inner { padding: 1rem 1.25rem 1.35rem; border-top: 1.5px solid var(--border); }

    /* ── Content inside accordion ── */
    .item-list { list-style: none; display: flex; flex-direction: column; gap: 0.85rem; }
    .item-list li { display: flex; align-items: center; gap: 0.75rem; font-size: 1rem; }
    .item-label { color: var(--muted); font-size: 0.85rem; min-width: 120px; flex-shrink: 0; font-weight: 500; }
    .item-list a { color: var(--primary); font-weight: 800; text-decoration: none; font-size: 1.15rem; }

    .bullet-list { padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
    .bullet-list li { font-size: 1.03rem; line-height: 1.65; color: var(--primary); }

    .checkin-row { display: flex; align-items: center; gap: 1.25rem; padding: 0.9rem 0; border-bottom: 1px solid var(--border); }
    .checkin-row:last-of-type { border-bottom: none; }
    .checkin-time { font-size: 2rem; font-weight: 800; color: var(--primary); letter-spacing: -0.03em; }
    .checkin-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }

    .guide-tip {
      background: var(--accent-light);
      border-left: 3px solid var(--primary);
      border-radius: 0 8px 8px 0;
      padding: 0.8rem 1rem; font-size: 0.98rem;
      color: #2A1A0C; margin-top: 0.85rem; line-height: 1.6;
    }

    .guide-item { display: flex; gap: 1rem; padding: 0.85rem 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .guide-item:last-child { border-bottom: none; padding-bottom: 0; }
    .guide-item-icon {
      font-size: 1.1rem; flex-shrink: 0;
      width: 38px; height: 38px;
      background: var(--accent-light);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .guide-item-text strong { display: block; font-size: 1rem; font-weight: 700; margin-bottom: 0.2rem; }
    .guide-item-text span { font-size: 0.96rem; color: var(--muted); line-height: 1.55; }

    .local-group-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); padding: 1rem 0 0.5rem; border-top: 1px solid var(--border); }
    .local-group-title:first-child { border-top: none; padding-top: 0; }

    /* ── Subgroup buttons — elegant ── */
    .subgroup-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.15rem;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.6rem;
      cursor: pointer; font-size: 0.97rem; font-weight: 600;
      color: var(--primary); text-align: left;
      transition: all 0.15s;
      letter-spacing: -0.01em;
    }
    .subgroup-btn:hover { border-color: var(--primary); background: var(--accent-light); }
    .subgroup-btn.open { background: var(--primary); color: #fff; border-color: var(--primary); }
    .subgroup-arrow { font-size: 0.65rem; transition: transform 0.25s; flex-shrink: 0; opacity: 0.45; }
    .subgroup-btn.open .subgroup-arrow { transform: rotate(180deg); opacity: 0.8; }
    .subgroup-panel { display: none; margin-bottom: 0.75rem; }
    .subgroup-panel.open { display: block; }
    .subgroup-html { padding: 0.25rem 0; }

    /* ── Swipe cards — premium ── */
    .swipe-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; border-radius: 14px; }
    .swipe-carousel::-webkit-scrollbar { display: none; }
    .swipe-card { flex: 0 0 100%; scroll-snap-align: start; border-radius: 14px; overflow: hidden; border: 1.5px solid var(--border); background: var(--surface); }
    .swipe-card-img { width: 100%; height: 250px; background: linear-gradient(135deg, #e8ddd0, #d4c4b0); display: flex; align-items: center; justify-content: center; font-size: 5rem; overflow: hidden; }
    .swipe-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .swipe-card-body { padding: 1.4rem 1.5rem 1.75rem; }
    .swipe-card-name { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.4rem; letter-spacing: -0.02em; }
    .swipe-card-dist {
      display: inline-flex; align-items: center;
      font-size: 0.72rem; color: var(--accent); font-weight: 700;
      margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
      background: var(--accent-light); border-radius: 999px; padding: 0.2rem 0.7rem;
    }
    .swipe-card-desc { font-size: 1.01rem; color: var(--muted); line-height: 1.65; margin-bottom: 1.35rem; }
    .swipe-card-link {
      display: inline-flex; align-items: center; gap: 0.5rem;
      border: 1.5px solid var(--primary); color: var(--primary);
      padding: 0.65rem 1.3rem; border-radius: 8px;
      font-size: 0.9rem; font-weight: 700; text-decoration: none;
      transition: all 0.15s;
    }
    .swipe-card-link:hover { background: var(--primary); color: #fff; }

    /* ── Footer ── */
    .guide-footer { text-align: center; padding: 2rem 1.5rem 3rem; border-top: 1px solid var(--border); margin-top: 0.5rem; }
    .guide-footer .heart { color: var(--accent); font-size: 1.3rem; display: block; margin-bottom: 0.65rem; }
    .guide-footer span { font-size: 1rem; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>

<!-- LANGUAGE SELECTION -->
<div id="lang-screen">
  <div style="text-align:center; margin-bottom: 2rem;">
    <div style="font-size:2rem; margin-bottom:0.5rem;">🏠</div>
    <div class="lang-brand">Apartman Mirakul</div>
    <div class="lang-subtitle">Izaberite jezik · Choose language</div>
  </div>
  <div class="lang-grid">
    <button class="lang-btn" onclick="setLang('sr')"><img class="lang-flag" src="https://flagcdn.com/w40/rs.png" alt=""> Srpski</button>
    <button class="lang-btn" onclick="setLang('en')"><img class="lang-flag" src="https://flagcdn.com/w40/gb.png" alt=""> English</button>
    <button class="lang-btn" onclick="setLang('de')"><img class="lang-flag" src="https://flagcdn.com/w40/de.png" alt=""> Deutsch</button>
    <button class="lang-btn" onclick="setLang('hr')"><img class="lang-flag" src="https://flagcdn.com/w40/hr.png" alt=""> Hrvatski</button>
    <button class="lang-btn" onclick="setLang('hu')"><img class="lang-flag" src="https://flagcdn.com/w40/hu.png" alt=""> Magyar</button>
    <button class="lang-btn" onclick="setLang('ru')"><img class="lang-flag" src="https://flagcdn.com/w40/ru.png" alt=""> Русский</button>
    <button class="lang-btn" onclick="setLang('it')"><img class="lang-flag" src="https://flagcdn.com/w40/it.png" alt=""> Italiano</button>
    <button class="lang-btn" onclick="setLang('es')"><img class="lang-flag" src="https://flagcdn.com/w40/es.png" alt=""> Español</button>
    <button class="lang-btn" onclick="setLang('ro')"><img class="lang-flag" src="https://flagcdn.com/w40/ro.png" alt=""> Română</button>
    <button class="lang-btn" onclick="setLang('pl')"><img class="lang-flag" src="https://flagcdn.com/w40/pl.png" alt=""> Polski</button>
    <button class="lang-btn" onclick="setLang('bg')"><img class="lang-flag" src="https://flagcdn.com/w40/bg.png" alt=""> Български</button>
    <button class="lang-btn" onclick="setLang('mk')"><img class="lang-flag" src="https://flagcdn.com/w40/mk.png" alt=""> Македонски</button>
    <button class="lang-btn" onclick="setLang('sl')"><img class="lang-flag" src="https://flagcdn.com/w40/si.png" alt=""> Slovenščina</button>
    <button class="lang-btn" onclick="setLang('zh')"><img class="lang-flag" src="https://flagcdn.com/w40/cn.png" alt=""> 中文</button>
    <button class="lang-btn" onclick="setLang('el')"><img class="lang-flag" src="https://flagcdn.com/w40/gr.png" alt=""> Ελληνικά</button>
    <button class="lang-btn" onclick="setLang('fr')"><img class="lang-flag" src="https://flagcdn.com/w40/fr.png" alt=""> Français</button>
  </div>
</div>

<!-- GUIDE -->
<div id="guide">
  <div class="guide-header">
    <div class="guide-header-name">Apartman Mirakul</div>
    <button class="lang-change-btn" id="lang-btn" onclick="showLangScreen()"><img class="lang-flag-sm" src="https://flagcdn.com/w20/rs.png" alt=""> SR</button>
  </div>
  <div class="guide-content">
    <div class="acc-item" id="wifi-acc">
      <button class="acc-trigger" onclick="togWifi()">
        <span class="acc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg></span>
        <span>WiFi</span>
        <span class="acc-arrow">▼</span>
      </button>
      <div class="acc-body">
        <div class="acc-inner" style="display:flex;flex-direction:column;gap:0.85rem;">
          <div class="wifi-row">
            <span class="wifi-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg></span>
            <div class="wifi-info">
              <div class="wifi-label" id="wifi-net-lbl">Naziv mreže</div>
              <div class="wifi-value">Apartman Mirakul 5G</div>
            </div>
          </div>
          <div class="wifi-row">
            <span class="wifi-icon">🔑</span>
            <div class="wifi-info">
              <div class="wifi-label" id="wifi-pass-lbl">Lozinka</div>
              <div class="wifi-value">dobrodosli</div>
            </div>
            <button class="copy-btn" onclick="copyWifi()">📋 <span id="copy-lbl">Kopiraj</span></button>
          </div>
        </div>
      </div>
    </div>
    <div id="sections"></div>
  </div>
  <button id="feedback-fab" onclick="openFeedback()" hidden style="position:fixed;bottom:1.5rem;right:1.5rem;width:48px;height:48px;background:var(--primary);color:#fff;border:none;border-radius:50%;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 16px rgba(42,26,12,0.3);display:flex;align-items:center;justify-content:center;z-index:100;transition:transform 0.2s;">💬</button>
  <div id="feedback-modal" hidden style="position:fixed;inset:0;background:rgba(42,26,12,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;">
    <div style="background:var(--surface);border-radius:20px 20px 0 0;padding:1.75rem 1.5rem 2.5rem;width:100%;max-width:640px;box-shadow:0 -4px 24px rgba(42,26,12,0.15);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;"><div id="fb-title" style="font-size:1rem;font-weight:700;color:var(--primary);">Predlog za unapređenje</div><button onclick="closeFeedback()" style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--muted);padding:0;line-height:1;">✕</button></div>
      <div id="fb-desc" style="font-size:0.88rem;color:var(--muted);margin-bottom:1rem;line-height:1.55;">Nedostaje vam neka informacija u vodiču? Napišite nam da dodamo.</div>
      <form id="feedback-form" action="https://formspree.io/f/xaqvrzva" method="POST">
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;opacity:0;height:0;width:0;" aria-hidden="true" />
        <input type="hidden" name="_subject" value="Feedback — Mirakul vodič za goste">
        <textarea id="fb-textarea" name="message" rows="4" required style="width:100%;border:1.5px solid var(--border);border-radius:10px;padding:0.85rem 1rem;font-family:inherit;font-size:0.92rem;color:var(--primary);background:var(--bg);resize:none;outline:none;" placeholder="Vaš predlog ili komentar..."></textarea>
        <button id="fb-btn" type="submit" style="margin-top:0.65rem;width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:0.85rem;font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;">Pošalji</button>
      </form>
      <div id="feedback-success" hidden style="text-align:center;padding:0.75rem 0 0;color:var(--accent);font-weight:700;"></div>
    </div>

function arrivalCard(a){
  const nav = (cls,label)=>`<a class="arr-btn ${cls}" href="${ARR_NAV}">${label}</a>`;
  return `<div class="arr">
    <div class="arr-q">${a.q}</div>
    <div class="arr-mode" id="arr-auto"><button class="arr-choice" onclick="arrPick('auto')"><span class="arr-ce">🚗</span> ${a.auto} <span class="arr-ar">▾</span></button><div class="arr-panel">
      <div class="arr-warn">${a.autoWarn}</div><p>${a.autoLead}</p>${nav('',a.navBtn)}
      <div class="arr-row"><span>🅿️</span><span>${a.autoParking}</span></div>
      <div class="arr-row"><span>💳</span><span>${a.autoSms}</span></div>
      <div class="arr-hours">${a.autoHours}</div></div></div>
    <div class="arr-mode" id="arr-voz"><button class="arr-choice" onclick="arrPick('voz')"><span class="arr-ce">🚆</span> ${a.voz} <span class="arr-ar">▾</span></button><div class="arr-panel">
      <p>${a.vozText}</p><div class="arr-row"><span>🌳</span><span>${a.vozPark}</span></div>${nav('ghost',a.walkBtn)}</div></div>
    <div class="arr-mode" id="arr-bus"><button class="arr-choice" onclick="arrPick('bus')"><span class="arr-ce">🚌</span> ${a.bus} <span class="arr-ar">▾</span></button><div class="arr-panel">
      <p>${a.busText}</p><div class="arr-row"><span>🚕</span><span>${a.busTaxi}</span></div><div class="arr-row"><span>🚶</span><span>${a.busWalk}</span></div>${nav('ghost',a.walkBtn)}</div></div>
    <div class="arr-checkin" id="arr-checkin" style="display:none"><h4>${a.ciTitle}</h4>
      <div class="arr-row"><span>⏰</span><span>${a.ciText}</span></div>
      <figure class="arr-mp"><img src="images/Guests/meeting-point/addiko-banka.jpg" alt="Addiko banka" loading="lazy" onclick="arrLightbox(this.src)" onerror="this.closest('.arr-mp').style.display='none'"><figcaption>${a.mpCaption}</figcaption></figure>
      <div class="arr-btns"><a class="arr-cbtn wa" href="https://wa.me/381631168024">${ARR_WA} WhatsApp</a><a class="arr-cbtn vi" href="viber://chat?number=%2B381631168024">${ARR_VI} Viber</a><a class="arr-cbtn call" href="tel:+381631168024">${ARR_PH} ${a.call}</a></div></div>
  </div>`;
}

function arrPick(m){
  const el=document.getElementById('arr-'+m);
  const wasOpen=el.classList.contains('open');
  document.querySelectorAll('.arr-mode').forEach(x=>x.classList.remove('open'));
  const ci=document.getElementById('arr-checkin');
  if(!wasOpen){ el.classList.add('open'); el.querySelector('.arr-panel').appendChild(ci); ci.style.display='block'; setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),60); }
  else { ci.style.display='none'; }
}

function arrLightbox(src){
  let lb = document.getElementById('arr-lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'arr-lightbox';
    lb.innerHTML = '<img>';
    lb.onclick = () => lb.classList.remove('open');
    document.body.appendChild(lb);
  }
  lb.querySelector('img').src = src;
  lb.classList.add('open');
}

        {t:'🕐 Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">by 11:00</div></div></div><div class="guide-tip">🔑 On check-out, leave the keys in the mailbox next to the entrance door. Please let the host know your estimated departure time.</div>`},

        {t:'🏛️ Attractions',cards:[

          {name:'Street of Old Crafts',dist:'100 m',desc:'Opened in 2025 — a charming passage reviving the spirit of old Subotica with tailors, watchmakers and a Zvonko Bogdan sculpture.',img:'images/Guests/Znamenitosti/ulica-starih-zanata.webp',maps:'https://maps.google.com/?q=Ulica+Starih+zanata+Subotica'},

    s:[

      {i:'💡',t:'Wohnungsführer',subs:[
        {t:'🏠 Hausordnung',h:`<ul class="bullet-list"><li>🏢 Bitte die anderen Bewohner des Gebäudes respektieren</li><li>🌙 Ruhezeit: <strong>22:00–08:00</strong></li><li>🥿 Aus Hygienegründen bitten wir Sie, in der Wohnung keine Straßenschuhe zu tragen — wir empfehlen das Tragen von Hausschuhen</li><li><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-3px;flex-shrink:0"><circle cx="12" cy="12" r="10" fill="none" stroke="#e74c3c" stroke-width="2"/><rect x="4" y="10.5" width="13" height="3" rx="1.5" fill="#666"/><rect x="17" y="10.5" width="3.5" height="3" rx="1" fill="#d4b896"/><line x1="4" y1="4" x2="20" y2="20" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/></svg> <strong>Rauchen verboten</strong> in der Wohnung und im Gebäude</li><li>🐾 <strong>Keine Haustiere</strong> erlaubt</li><li>👥 Max. Belegung: <strong>4 Personen</strong></li><li>🚪 Das Gebäudetor wird nach <strong>22:00 Uhr</strong> abgesperrt — der Torschlüssel liegt dem Wohnungsschlüssel bei</li><li>🧹 Bitte die Wohnung beim Abreisen ordentlich hinterlassen</li></ul>`},
        {t:'🕐 Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">bis 11:00</div></div></div><div class="guide-tip">🔑 Beim Check-out die Schlüssel bitte in den Briefkasten neben der Eingangstür einwerfen. Bitte den Gastgeber über die geplante Abreisezeit informieren.</div>`},
        {t:'ℹ️ Gut zu wissen',h:`<div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Warmwasser</strong><span>Der Boiler ist immer eingeschaltet — Warmwasser steht sofort zur Verfügung.</span></div></div><div class="guide-item"><span class="guide-item-icon">🚿</span><div class="guide-item-text"><strong>Wannenarmatur & Dusche</strong><span>Für die normale Dusche den Wasserauslass nach rechts schieben. Für die Regendusche den Hebel an der Armatur ziehen.</span></div></div><div class="guide-item"><span class="guide-item-icon">🪟</span><div class="guide-item-text"><strong>Verdunkelungsjalousien</strong><span>Holzjalousien in allen Räumen für Verdunkelung.</span></div></div><div class="guide-item"><span class="guide-item-icon">🔐</span><div class="guide-item-text"><strong>Türschloss</strong><span>Um die Eingangstür abzuschließen, zuerst den Griff hochziehen, dann den Schlüssel umdrehen.</span></div></div>`},
        {t:'⚙️ Geräte',h:`<div class="guide-item"><span class="guide-item-icon">📺</span><div class="guide-item-text"><strong>Philips TV 50"</strong><span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 12L12 3l9 9"/><path d="M5 10v9h5v-5h4v5h5v-9"/></svg> HOME-Taste drücken für Apps — Netflix, YouTube, Iris, Stremio, TiVimate.</span></div></div><div class="guide-item"><span class="guide-item-icon">❄️</span><div class="guide-item-text"><strong>Klimaanlage</strong><span>Die Fernbedienung liegt auf dem Regal neben der Bar.<br>⚠️ Es ist strengstens verboten, Fenster geöffnet zu lassen, während die Klimaanlage läuft.</span></div></div><div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Fußbodenheizung</strong><span>In der Saison auf 23°C eingestellt — wenden Sie sich an den Gastgeber, wenn eine Anpassung nötig ist.<br>⚠️ Es ist strengstens verboten, Fenster geöffnet zu lassen, wenn die Heizperiode aktiv ist.</span></div></div><div class="guide-item"><span class="guide-item-icon">🧺</span><div class="guide-item-text"><strong>Waschmaschine & Trockner</strong><span>Bedienungsanleitung in der Badezimmerschublade. Waschmittel wird vom Apartment nicht bereitgestellt.</span></div></div><div class="guide-item"><span class="guide-item-icon">💧</span><div class="guide-item-text"><strong>Wasserkocher</strong><span>Standardgerät zum Erhitzen von Wasser.</span></div></div><div class="guide-item"><span class="guide-item-icon">☕</span><div class="guide-item-text"><strong>Kaffeemaschine Gorenje</strong><span>Ausschließlich für die Kaffeezubereitung.<br>⚠️ Keine Metalllöffel oder Metallgegenstände einlegen, solange das Gerät eingeschaltet ist.</span></div></div><div class="guide-item"><span class="guide-item-icon">📡</span><div class="guide-item-text"><strong>Mikrowelle</strong><span>Maximale Leistung 900W.<br>⚠️ Niemals Metallgegenstände hineinstellen.</span></div></div>`},
        {t:'🅿️ Parkplatz',h:`<div style="display:inline-flex;align-items:center;gap:0.5rem;background:#fff1f0;border:1.5px solid #e74c3c;border-radius:8px;padding:0.4rem 0.85rem;margin-bottom:1rem;"><span style="color:#e74c3c;font-size:0.9rem;">●</span><span style="font-weight:700;font-size:0.9rem;color:#c0392b;">Rote Zone (1) — vor dem Gebäude</span></div><div class="checkin-row"><div><div class="checkin-label">Werktags</div><div class="checkin-time">07:00 – 21:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Samstags</div><div class="checkin-time">07:00 – 14:00</div></div></div><div class="checkin-row" style="border-bottom:none;"><div><div class="checkin-label">Sonntags & Feiertags</div><div style="font-size:1.55rem;font-weight:800;color:var(--accent);letter-spacing:-0.02em;">Kostenlos</div></div></div><div style="margin-top:1.1rem;"><div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.6rem;">Zahlung per SMS</div><div style="display:flex;flex-direction:column;gap:0.5rem;"><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Pro Stunde</div><div style="font-size:1.1rem;font-weight:800;">9241</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">70 RSD</div></div><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Tageskarte</div><div style="font-size:1.1rem;font-weight:800;">9245</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">480 RSD</div></div></div></div><div class="guide-tip" style="margin-top:0.85rem;">💡 Nach 21:00 Uhr können Sie das Parken für den nächsten Tag im Voraus bezahlen — SMS an <strong>9245</strong> senden und der Morgen ist gesichert.</div>`}

 Nikada ne stavljajte metalne predmete unutra.</span></div></div>`},

        {t:'🕐 Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">do 11:00</div></div></div><div class="guide-tip">🔑 Przy wyjeździe zostaw klucze w skrzynce pocztowej przy drzwiach wejściowych. Prosimy poinformować gospodarza o planowanej godzinie wyjazdu.</div>`},

    s:[
      {i:'🧳',t:ARR.it.title,h:arrivalCard(ARR.it)},
      {i:'💡',t:'Guida all\'appartamento',subs:[
        {t:'🏠 Regole della casa',h:`<ul class="bullet-list"><li>🏢 Si prega di rispettare gli altri residenti dell'edificio</li><li>🌙 Silenzio dalle <strong>22:00 alle 08:00</strong></li><li>🥿 Per motivi igienici, vi preghiamo di non camminare nell'appartamento con le scarpe da esterno — consigliamo l'uso delle pantofole</li><li><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-3px;flex-shrink:0"><circle cx="12" cy="12" r="10" fill="none" stroke="#e74c3c" stroke-width="2"/><rect x="4" y="10.5" width="13" height="3" rx="1.5" fill="#666"/><rect x="17" y="10.5" width="3.5" height="3" rx="1" fill="#d4b896"/><line x1="4" y1="4" x2="20" y2="20" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/></svg> <strong>Vietato fumare</strong> nell'appartamento e nell'edificio</li><li>🐾 <strong>Animali non ammessi</strong></li><li>👥 Capacità massima: <strong>4 persone</strong></li><li>🚪 Il cancello dell'edificio si chiude dopo le <strong>22:00</strong> — la chiave del cancello è inclusa con quella dell'appartamento</li><li>🧹 Si prega di lasciare l'appartamento in ordine alla partenza</li></ul>`},
        {t:'🕐 Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">entro le 11:00</div></div></div><div class="guide-tip">🔑 Al momento del check-out, lasciare le chiavi nella cassetta delle lettere accanto alla porta d'ingresso. Si prega di comunicare all'host l'orario previsto di partenza.</div>`},
        {t:'ℹ️ Utile sapere',h:`<div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Acqua calda</strong><span>Il boiler è sempre acceso — l'acqua calda è disponibile immediatamente.</span></div></div><div class="guide-item"><span class="guide-item-icon">🚿</span><div class="guide-item-text"><strong>Rubinetto vasca e doccia</strong><span>Per la doccia normale, spostate l'uscita dell'acqua a destra. Per il soffione, tirate la leva sul rubinetto.</span></div></div><div class="guide-item"><span class="guide-item-icon">🪟</span><div class="guide-item-text"><strong>Veneziane oscuranti</strong><span>Veneziane in legno in tutti i locali per l'oscuramento.</span></div></div><div class="guide-item"><span class="guide-item-icon">🔐</span><div class="guide-item-text"><strong>Serratura della porta</strong><span>Per chiudere la porta d'ingresso, sollevare prima la maniglia, poi girare la chiave.</span></div></div>`},
        {t:'⚙️ Elettrodomestici',h:`<div class="guide-item"><span class="guide-item-icon">📺</span><div class="guide-item-text"><strong>Philips TV 50"</strong><span>Premere <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 12L12 3l9 9"/><path d="M5 10v9h5v-5h4v5h5v-9"/></svg> HOME per scegliere un'app — Netflix, YouTube, Iris, Stremio, TiVimate.</span></div></div><div class="guide-item"><span class="guide-item-icon">❄️</span><div class="guide-item-text"><strong>Aria condizionata</strong><span>Il telecomando si trova sullo scaffale vicino al bancone.<br>⚠️ È severamente vietato tenere le finestre aperte mentre il condizionatore è acceso.</span></div></div><div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Riscaldamento a pavimento</strong><span>Impostato a 23°C durante la stagione — contattate il proprietario se è necessaria una regolazione.<br>⚠️ È severamente vietato tenere le finestre aperte durante la stagione di riscaldamento.</span></div></div><div class="guide-item"><span class="guide-item-icon">🧺</span><div class="guide-item-text"><strong>Lavatrice e asciugatrice</strong><span>Le istruzioni si trovano nel cassetto del bagno. Il detersivo non è fornito dall'appartamento.</span></div></div><div class="guide-item"><span class="guide-item-icon">💧</span><div class="guide-item-text"><strong>Bollitore</strong><span>Bollitore elettrico standard per riscaldare l'acqua.</span></div></div><div class="guide-item"><span class="guide-item-icon">☕</span><div class="guide-item-text"><strong>Macchina del caffè Gorenje</strong><span>Esclusivamente per fare il caffè.<br>⚠️ Non inserire un cucchiaino di metallo o oggetti metallici all'interno mentre il dispositivo è acceso.</span></div></div><div class="guide-item"><span class="guide-item-icon">📡</span><div class="guide-item-text"><strong>Microonde</strong><span>Potenza massima 900W.<br>⚠️ Non inserire mai oggetti metallici all'interno.</span></div></div>`},
        {t:'🅿️ Parcheggio',h:`<div style="display:inline-flex;align-items:center;gap:0.5rem;background:#fff1f0;border:1.5px solid #e74c3c;border-radius:8px;padding:0.4rem 0.85rem;margin-bottom:1rem;"><span style="color:#e74c3c;font-size:0.9rem;">●</span><span style="font-weight:700;font-size:0.9rem;color:#c0392b;">Zona rossa (1) — davanti all'edificio</span></div><div class="checkin-row"><div><div class="checkin-label">Giorni feriali</div><div class="checkin-time">07:00 – 21:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Sabato</div><div class="checkin-time">07:00 – 14:00</div></div></div><div class="checkin-row" style="border-bottom:none;"><div><div class="checkin-label">Domenica e festivi</div><div style="font-size:1.55rem;font-weight:800;color:var(--accent);letter-spacing:-0.02em;">Gratuito</div></div></div><div style="margin-top:1.1rem;"><div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.6rem;">Pagamento tramite SMS</div><div style="display:flex;flex-direction:column;gap:0.5rem;"><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">All'ora</div><div style="font-size:1.1rem;font-weight:800;">9241</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">70 RSD</div></div><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Giornaliero</div><div style="font-size:1.1rem;font-weight:800;">9245</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">480 RSD</div></div></div></div><div class="guide-tip" style="margin-top:0.85rem;">💡 Dopo le 21:00 è possibile pagare in anticipo il parcheggio per il giorno successivo — inviare un SMS al <strong>9245</strong> e la mattina è tranquilla.</div>`}

    s:[

      {i:'💡',t:'Guía del apartamento',subs:[
        {t:'🏠 Normas de la casa',h:`<ul class="bullet-list"><li>🏢 Por favor respete la tranquilidad de los demás residentes del edificio</li><li>🌙 Silencio obligatorio de <strong>22:00 a 08:00</strong></li><li>🥿 Por higiene, rogamos no caminar por el apartamento con calzado de calle — recomendamos el uso de zapatillas de casa</li><li><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-3px;flex-shrink:0"><circle cx="12" cy="12" r="10" fill="none" stroke="#e74c3c" stroke-width="2"/><rect x="4" y="10.5" width="13" height="3" rx="1.5" fill="#666"/><rect x="17" y="10.5" width="3.5" height="3" rx="1" fill="#d4b896"/><line x1="4" y1="4" x2="20" y2="20" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/></svg> <strong>Prohibido fumar</strong> en el apartamento y el edificio</li><li>🐾 <strong>No se admiten mascotas</strong></li><li>👥 Capacidad máxima: <strong>4 personas</strong></li><li>🚪 El portal del edificio se cierra a las <strong>22:00</strong> — la llave del portal se entrega junto con la llave del apartamento</li><li>🧹 Por favor deje el apartamento ordenado al marcharse</li></ul>`},
        {t:'🕐 Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">antes de las 11:00</div></div></div><div class="guide-tip">🔑 Al hacer el check-out, deje las llaves en el buzón junto a la puerta de entrada. Por favor informe al anfitrión de su hora estimada de salida.</div>`},
        {t:'ℹ️ Información útil',h:`<div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Agua caliente</strong><span>El calentador está siempre encendido — el agua caliente está disponible de inmediato.</span></div></div><div class="guide-item"><span class="guide-item-icon">🚿</span><div class="guide-item-text"><strong>Grifo y ducha de la bañera</strong><span>Para la ducha normal, deslice el desviador hacia la derecha. Para la ducha de lluvia, tire de la palanca del grifo.</span></div></div><div class="guide-item"><span class="guide-item-icon">🪟</span><div class="guide-item-text"><strong>Oscurecimiento</strong><span>Además de las cortinas oscuras, todas las habitaciones disponen de persianas de madera para un oscurecimiento total.</span></div></div><div class="guide-item"><span class="guide-item-icon">🔐</span><div class="guide-item-text"><strong>Cerradura de la puerta</strong><span>Para cerrar la puerta de entrada, tire del pomo hacia arriba y luego gire la llave.</span></div></div>`},
        {t:'⚙️ Electrodomésticos',h:`<div class="guide-item"><span class="guide-item-icon">📺</span><div class="guide-item-text"><strong>Philips TV 50"</strong><span>Pulse <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 12L12 3l9 9"/><path d="M5 10v9h5v-5h4v5h5v-9"/></svg> HOME para seleccionar aplicaciones — Netflix, YouTube, Iris, Stremio, TiVimate.</span></div></div><div class="guide-item"><span class="guide-item-icon">❄️</span><div class="guide-item-text"><strong>Aire acondicionado</strong><span>El mando a distancia está en el estante junto a la barra.<br>⚠️ Está estrictamente prohibido mantener las ventanas abiertas mientras el aire acondicionado esté en funcionamiento.</span></div></div><div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Suelo radiante</strong><span>En temporada siempre ajustado a 23°C — contacte al anfitrión si necesita algún ajuste.<br>⚠️ Está estrictamente prohibido mantener las ventanas abiertas durante la temporada de calefacción.</span></div></div><div class="guide-item"><span class="guide-item-icon">🧺</span><div class="guide-item-text"><strong>Lavadora y secadora</strong><span>Las instrucciones están en el cajón del baño. El detergente no lo proporciona el apartamento.</span></div></div><div class="guide-item"><span class="guide-item-icon">💧</span><div class="guide-item-text"><strong>Hervidor eléctrico</strong><span>Hervidor eléctrico estándar para calentar agua.</span></div></div><div class="guide-item"><span class="guide-item-icon">☕</span><div class="guide-item-text"><strong>Cafetera Gorenje</strong><span>Exclusivamente para hacer café.<br>⚠️ No introduzca una cucharilla metálica ni objetos metálicos mientras el aparato esté encendido.</span></div></div><div class="guide-item"><span class="guide-item-icon">📡</span><div class="guide-item-text"><strong>Microondas</strong><span>Potencia máxima 900W.<br>⚠️ No introduzca nunca objetos metálicos.</span></div></div>`},
        {t:'🅿️ Aparcamiento',h:`<div style="display:inline-flex;align-items:center;gap:0.5rem;background:#fff1f0;border:1.5px solid #e74c3c;border-radius:8px;padding:0.4rem 0.85rem;margin-bottom:1rem;"><span style="color:#e74c3c;font-size:0.9rem;">●</span><span style="font-weight:700;font-size:0.9rem;color:#c0392b;">Zona roja (1) — frente al edificio</span></div><div class="checkin-row"><div><div class="checkin-label">Días laborables</div><div class="checkin-time">07:00 – 21:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Sábados</div><div class="checkin-time">07:00 – 14:00</div></div></div><div class="checkin-row" style="border-bottom:none;"><div><div class="checkin-label">Domingos y festivos</div><div style="font-size:1.55rem;font-weight:800;color:var(--accent);letter-spacing:-0.02em;">Gratis</div></div></div><div style="margin-top:1.1rem;"><div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.6rem;">Pago por SMS</div><div style="display:flex;flex-direction:column;gap:0.5rem;"><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Por hora</div><div style="font-size:1.1rem;font-weight:800;">9241</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">70 RSD</div></div><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Tarifa diaria</div><div style="font-size:1.1rem;font-weight:800;">9245</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">480 RSD</div></div></div></div><div class="guide-tip" style="margin-top:0.85rem;">💡 Después de las 21:00 puede pagar por adelantado el aparcamiento del día siguiente — envíe un SMS al <strong>9245</strong> y la mañana estará tranquila.</div>`}

        {t:'ℹ️ Добро е да се знае',h:`<div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Топла вода</strong><span>Бојлерот е постојано вклучен — топлата вода е достапна веднаш.</span></div></div><div class="guide-item"><span class="guide-item-icon">🚿</span><div class="guide-item-text"><strong>Чешма и туш во бања</strong><span>За обичен туш поместете го излезот за вода надесно, а за голема дожд-туш рачка повлечете ја рачката на чешмата.</span></div></div><div class="guide-item"><span class="guide-item-icon">🪟</span><div class="guide-item-text"><strong>Затемнување</strong><span>Покрај темните завеси, во сите простории има дрвени жалузии за затемнување.</span></div></div><div class="guide-item"><span class="guide-item-icon">🔐</span><div class="guide-item-text"><strong>Заклучување врати</strong><span>За да ги заклучите влезните врати, прво повлечете ја рачката нагоре, па дури тогаш вртете го клучот.</span></div></div>`},

имална моќност 900W.<br>⚠️ Никогаш не ставајте метални предмети внатре.</span></div></div>`},

    s:[

      {i:'💡',t:'Ghidul apartamentului',subs:[
        {t:'🏠 Regulament intern',h:`<ul class="bullet-list"><li>🏢 Vă rugăm să respectați liniștea celorlalți locatari ai clădirii</li><li>🌙 Liniște obligatorie între <strong>22:00 și 08:00</strong></li><li>🥿 Din motive de igienă, vă rugăm să nu umblați prin apartament cu încălțăminte de stradă — recomandăm folosirea papucilor de casă</li><li><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-3px;flex-shrink:0"><circle cx="12" cy="12" r="10" fill="none" stroke="#e74c3c" stroke-width="2"/><rect x="4" y="10.5" width="13" height="3" rx="1.5" fill="#666"/><rect x="17" y="10.5" width="3.5" height="3" rx="1" fill="#d4b896"/><line x1="4" y1="4" x2="20" y2="20" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/></svg> <strong>Fumatul este strict interzis</strong> în apartament și în clădire</li><li>🐾 <strong>Animalele de companie nu sunt permise</strong></li><li>👥 Număr maxim de oaspeți: <strong>4 persoane</strong></li><li>🚪 Poarta clădirii se încuie după <strong>22:00</strong> — cheia porții a fost predată împreună cu cheia apartamentului</li><li>🧹 Vă rugăm să lăsați apartamentul ordonat la plecare</li></ul>`},
        {t:'🕐 Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">până la 11:00</div></div></div><div class="guide-tip">🔑 La check-out, lăsați cheile în cutia poștală de lângă ușa de intrare. Vă rugăm să anunțați gazda despre ora estimată de plecare.</div>`},
        {t:'ℹ️ Bine de știut',h:`<div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Apă caldă</strong><span>Boilerul este mereu pornit — apa caldă este disponibilă imediat.</span></div></div><div class="guide-item"><span class="guide-item-icon">🚿</span><div class="guide-item-text"><strong>Robinet cadă și duș</strong><span>Pentru dușul normal, glisați desviatorul de apă spre dreapta. Pentru dușul cu ploaie, trageți mânerul de pe robinet.</span></div></div><div class="guide-item"><span class="guide-item-icon">🪟</span><div class="guide-item-text"><strong>Întunecare</strong><span>Pe lângă draperiile opace, toate camerele dispun de jaluzele din lemn pentru întunecare completă.</span></div></div><div class="guide-item"><span class="guide-item-icon">🔐</span><div class="guide-item-text"><strong>Încuierea ușii</strong><span>Pentru a încuia ușa de intrare, trageți mânerul în sus și apoi rotiți cheia.</span></div></div>`},
        {t:'⚙️ Aparate',h:`<div class="guide-item"><span class="guide-item-icon">📺</span><div class="guide-item-text"><strong>Philips TV 50"</strong><span>Apăsați <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 12L12 3l9 9"/><path d="M5 10v9h5v-5h4v5h5v-9"/></svg> HOME pentru a selecta aplicații — Netflix, YouTube, Iris, Stremio, TiVimate.</span></div></div><div class="guide-item"><span class="guide-item-icon">❄️</span><div class="guide-item-text"><strong>Aer condiționat</strong><span>Telecomanda se află pe raftul de lângă bar.<br>⚠️ Este strict interzis să lăsați ferestrele deschise cât timp aerul condiționat este pornit.</span></div></div><div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Încălzire în pardoseală</strong><span>În sezon, setată mereu la 23°C — contactați gazda dacă este necesară o ajustare.<br>⚠️ Este strict interzis să lăsați ferestrele deschise în timpul sezonului de încălzire.</span></div></div><div class="guide-item"><span class="guide-item-icon">🧺</span><div class="guide-item-text"><strong>Mașină de spălat și uscător</strong><span>Instrucțiunile se află în sertarul de la baie. Detergentul nu este asigurat de apartament.</span></div></div><div class="guide-item"><span class="guide-item-icon">💧</span><div class="guide-item-text"><strong>Fierbător electric</strong><span>Fierbător electric standard pentru încălzirea apei.</span></div></div><div class="guide-item"><span class="guide-item-icon">☕</span><div class="guide-item-text"><strong>Cafetieră Gorenje</strong><span>Destinată exclusiv pentru prepararea cafelei.<br>⚠️ Nu introduceți o linguriță metalică sau obiecte metalice în interior cât timp aparatul este pornit.</span></div></div><div class="guide-item"><span class="guide-item-icon">📡</span><div class="guide-item-text"><strong>Cuptor cu microunde</strong><span>Putere maximă 900W.<br>⚠️ Nu introduceți niciodată obiecte metalice în interior.</span></div></div>`},

        {t:'🕐 Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">έως 11:00</div></div></div><div class="guide-tip">🔑 Κατά την αναχώρηση, αφήστε τα κλειδιά στο γραμματοκιβώτιο δίπλα στην εξώπορτα. Παρακαλούμε ενημερώστε τον οικοδεσπότη για την εκτιμώμενη ώρα αναχώρησής σας.</div>`},
        {t:'ℹ️ Καλό να γνωρίζετε',h:`<div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Ζεστό νερό</strong><span>Ο θερμοσίφωνας είναι πάντα αναμμένος — ζεστό νερό διαθέσιμο αμέσως.</span></div></div><div class="guide-item"><span class="guide-item-icon">🚿</span><div class="guide-item-text"><strong>Βρύση μπανιέρας & ντους</strong><span>Για το κανονικό ντους, σύρετε την έξοδο νερού προς τα δεξιά. Για το ντους κεφαλής, τραβήξτε τον μοχλό στη βρύση.</span></div></div><div class="guide-item"><span class="guide-item-icon">🪟</span><div class="guide-item-text"><strong>Συσκότιση</strong><span>Ξύλινα στόρια είναι διαθέσιμα σε όλα τα δωμάτια για συσκότιση.</span></div></div><div class="guide-item"><span class="guide-item-icon">🔐</span><div class="guide-item-text"><strong>Κλείδωμα πόρτας</strong><span>Για να κλειδώσετε την εξώπορτα, τραβήξτε πρώτα το χερούλι προς τα πάνω και μετά γυρίστε το κλειδί.</span></div></div>`},
        {t:'⚙️ Συσκευές',h:`<div class="guide-item"><span class="guide-item-icon">📺</span><div class="guide-item-text"><strong>Philips TV 50"</strong><span>Πατήστε <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 12L12 3l9 9"/><path d="M5 10v9h5v-5h4v5h5v-9"/></svg> HOME για να επιλέξετε εφαρμογή — Netflix, YouTube, Iris, Stremio, TiVimate.</span></div></div><div class="guide-item"><span class="guide-item-icon">❄️</span><div class="guide-item-text"><strong>Κλιματισμός</strong><span>Το τηλεχειριστήριο βρίσκεται στο ράφι κοντά στον πάγκο μπαρ.<br>⚠️ Απαγορεύεται αυστηρά να κρατάτε τα παράθυρα ανοιχτά όταν λειτουργεί ο κλιματισμός.</span></div></div><div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Ενδοδαπέδια θέρμανση</strong><span>Ρυθμισμένη στους 23°C κατά τη σεζόν — επικοινωνήστε με τον οικοδεσπότη εάν χρειάζεται ρύθμιση.<br>⚠️ Απαγορεύεται αυστηρά να κρατάτε τα παράθυρα ανοιχτά κατά την περίοδο θέρμανσης.</span></div></div><div class="guide-item"><span class="guide-item-icon">🧺</span><div class="guide-item-text"><strong>Πλυντήριο & στεγνωτήριο</strong><span>Οδηγίες στο συρτάρι του μπάνιου. Το απορρυπαντικό δεν παρέχεται από το διαμέρισμα.</span></div></div><div class="guide-item"><span class="guide-item-icon">💧</span><div class="guide-item-text"><strong>Βραστήρας</strong><span>Τυπικός ηλεκτρικός βραστήρας νερού.</span></div></div><div class="guide-item"><span class="guide-item-icon">☕</span><div class="guide-item-text"><strong>Καφετιέρα Gorenje</strong><span>Αποκλειστικά για την παρασκευή καφέ.<br>⚠️ Μην τοποθετείτε μεταλλικό κουταλάκι ή μεταλλικά αντικείμενα μέσα ενώ η συσκευή λειτουργεί.</span></div></div><div class="guide-item"><span class="guide-item-icon">📡</span><div class="guide-item-text"><strong>Φούρνος μικροκυμάτων</strong><span>Μέγιστη ισχύς 900W.<br>⚠️ Ποτέ μην τοποθετείτε μεταλλικά αντικείμενα μέσα.</span></div></div>`},
        {t:'🅿️ Πάρκινγκ',h:`<div style="display:inline-flex;align-items:center;gap:0.5rem;background:#fff1f0;border:1.5px solid #e74c3c;border-radius:8px;padding:0.4rem 0.85rem;margin-bottom:1rem;"><span style="color:#e74c3c;font-size:0.9rem;">●</span><span style="font-weight:700;font-size:0.9rem;color:#c0392b;">Κόκκινη ζώνη (1) — μπροστά από το κτίριο</span></div><div class="checkin-row"><div><div class="checkin-label">Καθημερινές</div><div class="checkin-time">07:00 – 21:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Σάββατο</div><div class="checkin-time">07:00 – 14:00</div></div></div><div class="checkin-row" style="border-bottom:none;"><div><div class="checkin-label">Κυριακή & αργίες</div><div style="font-size:1.55rem;font-weight:800;color:var(--accent);letter-spacing:-0.02em;">Δωρεάν</div></div></div><div style="margin-top:1.1rem;"><div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.6rem;">Πληρωμή με SMS</div><div style="display:flex;flex-direction:column;gap:0.5rem;"><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Ανά ώρα</div><div style="font-size:1.1rem;font-weight:800;">9241</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">70 RSD</div></div><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Ημερήσιο εισιτήριο</div><div style="font-size:1.1rem;font-weight:800;">9245</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">480 RSD</div></div></div></div><div class="guide-tip" style="margin-top:0.85rem;">💡 Μετά τις 21:00 μπορείτε να προπληρώσετε το πάρκινγκ για την επόμενη ημέρα — στείλτε SMS στο <strong>9245</strong> και το πρωί σας είναι τακτοποιημένο.</div>`}
      ]},

    s:[
      {i:'🧳',t:ARR.fr.title,h:arrivalCard(ARR.fr)},
      {i:'💡',t:'Guide de l\'appartement',subs:[
        {t:'🏠 Règlement intérieur',h:`<ul class="bullet-list"><li>🏢 Veuillez respecter les autres résidents de l\'immeuble</li><li>🌙 Heures de silence : <strong>22:00–08:00</strong></li><li>🥿 Pour des raisons d\'hygiène, veuillez ne pas circuler dans l\'appartement avec des chaussures d\'extérieur — nous recommandons de porter des chaussons</li><li><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-3px;flex-shrink:0"><circle cx="12" cy="12" r="10" fill="none" stroke="#e74c3c" stroke-width="2"/><rect x="4" y="10.5" width="13" height="3" rx="1.5" fill="#666"/><rect x="17" y="10.5" width="3.5" height="3" rx="1" fill="#d4b896"/><line x1="4" y1="4" x2="20" y2="20" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/></svg> Il est <strong>strictement interdit de fumer</strong> dans l\'appartement et l\'immeuble</li><li>🐾 Les <strong>animaux ne sont pas admis</strong></li><li>👥 Capacité maximale : <strong>4 personnes</strong></li><li>🚪 Le portail de l\'immeuble se verrouille après <strong>22:00</strong> — la clé du portail est fournie avec la clé de l\'appartement</li><li>🧹 Merci de laisser l\'appartement en ordre à votre départ</li></ul>`},
        {t:'🕐 Check-in / Check-out',h:`<div class="checkin-row"><div><div class="checkin-label">Check-in</div><div class="checkin-time">15:00–23:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Check-out</div><div class="checkin-time">jusqu\'à 11:00</div></div></div><div class="guide-tip">🔑 Au départ, laissez les clés dans la boîte aux lettres à côté de la porte d\'entrée. Merci d\'informer l\'hôte de votre heure de départ estimée.</div>`},
        {t:'ℹ️ Bon à savoir',h:`<div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Eau chaude</strong><span>Le chauffe-eau est toujours allumé — l\'eau chaude est disponible immédiatement.</span></div></div><div class="guide-item"><span class="guide-item-icon">🚿</span><div class="guide-item-text"><strong>Robinet de baignoire & douche</strong><span>Pour la douche normale, glissez la sortie d\'eau vers la droite. Pour la douche de tête, tirez le levier du robinet.</span></div></div><div class="guide-item"><span class="guide-item-icon">🪟</span><div class="guide-item-text"><strong>Occultation</strong><span>Des stores en bois sont disponibles dans toutes les pièces pour l\'obscurité.</span></div></div><div class="guide-item"><span class="guide-item-icon">🔐</span><div class="guide-item-text"><strong>Verrouillage de la porte</strong><span>Pour verrouiller la porte d\'entrée, tirez d\'abord la poignée vers le haut, puis tournez la clé.</span></div></div>`},
        {t:'⚙️ Appareils',h:`<div class="guide-item"><span class="guide-item-icon">📺</span><div class="guide-item-text"><strong>Philips TV 50"</strong><span>Appuyez sur <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M3 12L12 3l9 9"/><path d="M5 10v9h5v-5h4v5h5v-9"/></svg> HOME pour choisir une application — Netflix, YouTube, Iris, Stremio, TiVimate.</span></div></div><div class="guide-item"><span class="guide-item-icon">❄️</span><div class="guide-item-text"><strong>Climatisation</strong><span>La télécommande se trouve sur l\'étagère près du comptoir bar.<br>⚠️ Il est strictement interdit de laisser les fenêtres ouvertes lorsque la climatisation fonctionne.</span></div></div><div class="guide-item"><span class="guide-item-icon">🌡️</span><div class="guide-item-text"><strong>Chauffage au sol</strong><span>Réglé à 23°C pendant la saison — contactez l\'hôte si un réglage est nécessaire.<br>⚠️ Il est strictement interdit de laisser les fenêtres ouvertes pendant la saison de chauffage.</span></div></div><div class="guide-item"><span class="guide-item-icon">🧺</span><div class="guide-item-text"><strong>Lave-linge & sèche-linge</strong><span>Instructions dans le tiroir de la salle de bain. La lessive n\'est pas fournie par l\'appartement.</span></div></div><div class="guide-item"><span class="guide-item-icon">💧</span><div class="guide-item-text"><strong>Bouilloire</strong><span>Bouilloire électrique standard.</span></div></div><div class="guide-item"><span class="guide-item-icon">☕</span><div class="guide-item-text"><strong>Cafetière Gorenje</strong><span>Exclusivement pour préparer le café.<br>⚠️ Ne placez pas de cuillère métallique ni d\'objets métalliques à l\'intérieur lorsque l\'appareil est en marche.</span></div></div><div class="guide-item"><span class="guide-item-icon">📡</span><div class="guide-item-text"><strong>Micro-ondes</strong><span>Puissance maximale 900W.<br>⚠️ Ne placez jamais d\'objets métalliques à l\'intérieur.</span></div></div>`},
        {t:'🅿️ Parking',h:`<div style="display:inline-flex;align-items:center;gap:0.5rem;background:#fff1f0;border:1.5px solid #e74c3c;border-radius:8px;padding:0.4rem 0.85rem;margin-bottom:1rem;"><span style="color:#e74c3c;font-size:0.9rem;">●</span><span style="font-weight:700;font-size:0.9rem;color:#c0392b;">Zone rouge (1) — devant l\'immeuble</span></div><div class="checkin-row"><div><div class="checkin-label">En semaine</div><div class="checkin-time">07:00 – 21:00</div></div></div><div class="checkin-row"><div><div class="checkin-label">Samedi</div><div class="checkin-time">07:00 – 14:00</div></div></div><div class="checkin-row" style="border-bottom:none;"><div><div class="checkin-label">Dimanche & jours fériés</div><div style="font-size:1.55rem;font-weight:800;color:var(--accent);letter-spacing:-0.02em;">Gratuit</div></div></div><div style="margin-top:1.1rem;"><div style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:0.6rem;">Paiement par SMS</div><div style="display:flex;flex-direction:column;gap:0.5rem;"><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Par heure</div><div style="font-size:1.1rem;font-weight:800;">9241</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">70 RSD</div></div><div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.75rem 1rem;"><div><div style="font-size:0.72rem;color:var(--muted);font-weight:600;margin-bottom:0.1rem;">Forfait journalier</div><div style="font-size:1.1rem;font-weight:800;">9245</div></div><div style="font-size:1.1rem;font-weight:800;color:var(--accent);">480 RSD</div></div></div></div><div class="guide-tip" style="margin-top:0.85rem;">💡 Après 21:00, vous pouvez prépayer le parking pour le lendemain — envoyez un SMS au <strong>9245</strong> et votre matinée est réglée.</div>`}
      ]},

          {name:'Salle de sport Dudova šuma',dist:'2 km',desc:'Salle de sport polyvalente — basket, volley, tennis et autres sports.',img:'images/Guests/Sport/Hala Sportova.webp',maps:'https://maps.google.com/?q=Hala+sportova+Dudova+suma+Subotica'}

let currentLang = 'sr';

function wifiSubGroup(t) {
  const svgW = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>`;
  const svgBtn = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:0.4em"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>`;
  const inner = `<div style="display:flex;flex-direction:column;gap:0.85rem;"><div class="wifi-row"><span class="wifi-icon">${svgW}</span><div class="wifi-info"><div class="wifi-label">${t.wn}</div><div class="wifi-value">Apartman Mirakul 5G</div></div></div><div class="wifi-row"><span class="wifi-icon">🔑</span><div class="wifi-info"><div class="wifi-label">${t.wp}</div><div class="wifi-value">dobrodosli</div></div><button class="copy-btn" onclick="copyWifi(this)">📋 <span>${t.cp}</span></button></div></div>`;
  return `<button class="subgroup-btn" onclick="togSub(this)"><span>${svgBtn}WiFi</span><span class="subgroup-arrow">▼</span></button><div class="subgroup-panel"><div class="subgroup-html">${inner}</div></div>`;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('mirakul_lang', lang);
  const t = T[lang];
  const wifiIdx = t.s.findIndex(sec => sec.subs);
  const hasNewWifi = wifiIdx !== -1;
  document.getElementById('wifi-acc').style.display = hasNewWifi ? 'none' : '';
  if (!hasNewWifi) {
    document.getElementById('wifi-net-lbl').textContent = t.wn;
    document.getElementById('wifi-pass-lbl').textContent = t.wp;
    document.getElementById('copy-lbl').textContent = t.cp;
  }
  document.getElementById('footer-txt').textContent = t.ft;
  document.getElementById('lang-btn').innerHTML = FLAGS[lang] + ' ' + CODES[lang];
  document.getElementById('sections').innerHTML = t.s.map((s,i) => {
    const inner = s.subs
      ? (i === wifiIdx ? wifiSubGroup(t) : '') + s.subs.map(sub =>
          `<button class="subgroup-btn" onclick="togSub(this)"><span>${sub.t}</span><span class="subgroup-arrow">▼</span></button>` +
          `<div class="subgroup-panel">` +
          (sub.cards
            ? `<div class="swipe-carousel">${sub.cards.map(c =>
                `<div class="swipe-card"><div class="swipe-card-img">${c.img ? `<img src="${c.img}" alt="${c.name}">` : c.emoji}</div><div class="swipe-card-body"><div class="swipe-card-name">${c.name}</div><div class="swipe-card-dist">${c.dist}</div><div class="swipe-card-desc">${c.desc}</div><div style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center">${c.maps ? `<a href="${c.maps}" target="_blank" rel="noopener" class="swipe-card-link">📍 Google Maps</a>` : ''}${c.phone ? `<a href="tel:${c.phone}" class="swipe-card-link">📞 ${t.call || 'Pozovi'}</a>` : ''}${c.link ? `<a href="${c.link}" target="_blank" rel="noopener" class="swipe-card-link">🗓️ ${c.linkLabel || 'Red vožnje'}</a>` : ''}</div></div></div>`
              ).join('')}</div>`
            : `<div class="subgroup-html">${sub.h}</div>`) +
          `</div>`
        ).join('')
      : s.h;
    return `<div class="acc-item" id="a${i}"><button class="acc-trigger" onclick="tog(${i})"><span class="acc-icon">${s.i}</span><span>${s.t}</span><span class="acc-arrow">▼</span></button><div class="acc-body"><div class="acc-inner">${inner}</div></div></div>`;
  }).join('');
  document.getElementById('lang-screen').style.display = 'none';
  const g = document.getElementById('guide');
  g.style.display = 'flex';
  document.getElementById('feedback-fab').removeAttribute('hidden');
  const fb = FB[lang] || FB.sr;
  document.getElementById('fb-title').textContent = fb.title;
  document.getElementById('fb-desc').textContent = fb.desc;
  document.getElementById('fb-textarea').placeholder = fb.ph;
  document.getElementById('fb-btn').textContent = fb.btn;
  document.getElementById('feedback-success').textContent = fb.ok;
}

function showLangScreen() {
  document.getElementById('lang-screen').style.display = 'flex';
  document.getElementById('guide').style.display = 'none';
  document.getElementById('feedback-fab').setAttribute('hidden', '');
  closeFeedback();
}

function tog(i) {
  const el = document.getElementById('a' + i);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.acc-item.open').forEach(e => e.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}

function togSub(btn) {
  const panel = btn.nextElementSibling;
  const wasOpen = btn.classList.contains('open');
  btn.closest('.acc-inner').querySelectorAll('.subgroup-btn').forEach(b => b.classList.remove('open'));
  btn.closest('.acc-inner').querySelectorAll('.subgroup-panel').forEach(p => p.classList.remove('open'));
  if (!wasOpen) { btn.classList.add('open'); panel.classList.add('open'); }
}

function togWifi() {
  document.getElementById('wifi-acc').classList.toggle('open');
}

function copyWifi(btn) {
  const pw = 'dobrodosli';
  const lbl = btn ? btn.querySelector('span') : document.getElementById('copy-lbl');
  const done = () => { if(lbl){lbl.textContent=T[currentLang].cd; setTimeout(()=>{ if(lbl) lbl.textContent=T[currentLang].cp; },2000);} };
  if (navigator.clipboard) { navigator.clipboard.writeText(pw).then(done); }
  else { const el = document.createElement('textarea'); el.value = pw; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); done(); }
}

function openFeedback() {
  document.getElementById('feedback-modal').removeAttribute('hidden');
  document.body.style.overflow = 'hidden';
}
function closeFeedback() {
  document.getElementById('feedback-modal').setAttribute('hidden', '');
  document.body.style.overflow = '';
}
document.getElementById('feedback-modal')?.addEventListener('click', e => {
  if (e.target === document.getElementById('feedback-modal')) closeFeedback();
});
document.getElementById('feedback-form')?.addEventListener('submit', e => {
  e.preventDefault();
  fetch(e.target.action, { method: 'POST', body: new FormData(e.target), headers: { Accept: 'application/json' } })
    .then(r => {
      if (r.ok) {
        e.target.style.display = 'none';
        document.getElementById('feedback-success').hidden = false;
        setTimeout(() => { closeFeedback(); e.target.style.display = ''; document.getElementById('feedback-success').hidden = true; e.target.reset(); }, 2500);
      }
    });
});

const saved = localStorage.getItem('mirakul_lang');
if (saved && T[saved]) setLang(saved);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
    .then(reg => reg.update());
}
</script>
